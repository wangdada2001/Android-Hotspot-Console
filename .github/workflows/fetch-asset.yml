name: fetch-asset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    if: ${{ contains(github.event.head_commit.message, '[fetch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o Android_Hotspot_Console_0.5.5_lite_obfuscated.zip "https://aka.doubaocdn.com/s/BdvwXLKdBL"
          ls -l Android_Hotspot_Console_0.5.5_lite_obfuscated.zip
          sha256sum Android_Hotspot_Console_0.5.5_lite_obfuscated.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Android_Hotspot_Console_0.5.5_lite_obfuscated.zip
          git commit -m "Replace lite zip with repo update-channel build"
          git push
