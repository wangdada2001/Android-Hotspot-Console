name: cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rm:
    if: ${{ contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- Android_Hotspot_Console_0.5.5_lite_obfuscated.zip
          git commit -m "Keep build artifact in Releases only"
          git push
